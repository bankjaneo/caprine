name: Build and publish
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: [tests]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Caprine
        run: npm run build
      - name: Cleanup tag
        id: release_tag
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref_name || context.payload.ref.replace('refs/tags/', '');
            core.setOutput('value', tag.replace(/^v/, ''));
      - name: Detect prerelease tag
        id: release_type
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure GitHub Release exists
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if [[ "${{ steps.release_type.outputs.is_prerelease }}" == "true" ]]; then
            # A prerelease is never marked as latest, so /releases/latest keeps
            # pointing at the last stable build and electron-updater won't offer
            # the beta to stable installs.
            if ! gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
              # The matrix jobs race to create the release; a duplicate create
              # fails harmlessly and the edit below still applies the flags.
              gh release create "$tag" --title "$tag" --generate-notes --prerelease --latest=false --repo "$repo" || true
            fi
            gh release edit "$tag" --prerelease --latest=false --repo "$repo"
          else
            gh release create "$tag" --title "$tag" --generate-notes --repo "$repo" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Snapcraft
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo snap install snapcraft --classic
      - name: Package Caprine for macOS (arm64)
        if: startsWith(matrix.os, 'macos')
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist:mac:arm64 -- --publish never
          mv dist/latest-mac.yml dist/latest-mac-arm64.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin Electron 29 for x64 mac build
        if: startsWith(matrix.os, 'macos')
        run: |
          npm install --no-save electron@29.4.6
          npm run build
      - name: Package Caprine for macOS (x64)
        if: startsWith(matrix.os, 'macos')
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist:mac:x64 -- --publish never
          mv dist/latest-mac.yml dist/latest-mac-x64.yml
          node scripts/merge-latest-mac.mjs
          rm dist/latest-mac-arm64.yml dist/latest-mac-x64.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload macOS artifacts to GitHub Release
        if: startsWith(matrix.os, 'macos')
        run: gh release upload "${{ github.ref_name }}" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Caprine for Windows
        if: startsWith(matrix.os, 'windows')
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows artifacts to GitHub Release
        if: startsWith(matrix.os, 'windows')
        run: gh release upload "${{ github.ref_name }}" dist/*.exe dist/*.blockmap dist/latest*.yml --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Caprine for Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: npm run dist:linux -- --publish never
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux artifacts to GitHub Release
        if: startsWith(matrix.os, 'ubuntu')
        run: gh release upload "${{ github.ref_name }}" dist/*.AppImage dist/*.deb dist/latest*.yml --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build RPM packages (x86_64 and arm64)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          bash build-rpm.sh
      - name: Upload RPM packages to GitHub Releases
        if: startsWith(matrix.os, 'ubuntu')
        run: gh release upload "${{ github.ref_name }}" dist/*.rpm --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Pacman packages (x86_64 and aarch64)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # Build pacman packages in Arch Linux container. The image is a stale
          # rolling release, so a full upgrade (-Syu) is required: -Sy alone
          # fails on dependency breaks like openssl 4 vs libcrypto.so=3.
          docker run --rm -v "${{ github.workspace }}":/caprine archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm base-devel nodejs npm git rsync sudo
            useradd -m -s /bin/bash builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builder:builder /caprine
            su - builder -c "cd /caprine && bash build-pacman.sh"
          '
          
          # Fix permissions on built packages
          sudo chown -R runner:runner dist/
      - name: Upload Pacman packages to GitHub Releases
        if: startsWith(matrix.os, 'ubuntu')
        run: gh release upload "${{ github.ref_name }}" dist/*.pkg.tar.zst --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload x64 deb to Gemfury
        if: startsWith(matrix.os, 'ubuntu') && steps.release_type.outputs.is_prerelease == 'false'
        run: |
          deb_file=$(ls dist/Caprine-*-amd64.deb 2>/dev/null | head -1)
          if [ -z "$deb_file" ]; then
            echo "Error: No amd64 deb file found"
            exit 1
          fi
          curl -F package=@$deb_file https://${{ secrets.gemfury_token }}@push.fury.io/wdis/
      - name: Upload ARM64 deb to Gemfury
        if: startsWith(matrix.os, 'ubuntu') && steps.release_type.outputs.is_prerelease == 'false'
        run: |
          deb_file=$(ls dist/Caprine-*-arm64.deb 2>/dev/null | head -1)
          if [ -z "$deb_file" ]; then
            echo "Error: No arm64 deb file found"
            exit 1
          fi
          curl -F package=@$deb_file https://${{ secrets.gemfury_token }}@push.fury.io/wdis/
